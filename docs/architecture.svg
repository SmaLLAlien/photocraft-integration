<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="250" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
  </defs>

  <!-- Angular -->
  <rect x="20" y="20" width="300" height="210" rx="10" fill="#fdecef" stroke="#c3002f" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="#8a0021">Ваше Angular-приложение</text>
  <rect x="40" y="66" width="260" height="146" rx="8" fill="#fff" stroke="#c3002f" stroke-opacity=".5"/>
  <text x="56" y="92" font-weight="600" fill="#222">&lt;app-photocraft-editor&gt;</text>
  <text x="56" y="122" fill="#333">open(file)</text>
  <text x="56" y="150" fill="#333">export('png' | 'psd' | …)</text>
  <text x="56" y="178" fill="#333">(saved)</text>
  <text x="56" y="200" fill="#777" font-size="12">→ Blob: name, mime, blob</text>

  <!-- arrows -->
  <line x1="300" y1="118" x2="436" y2="118" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="436" y1="146" x2="300" y2="146" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="436" y1="174" x2="300" y2="174" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="368" y="108" text-anchor="middle" fill="#555" font-size="12">postMessage</text>
  <text x="368" y="200" text-anchor="middle" fill="#777" font-size="12">байты файлов</text>

  <!-- PhotoCraft -->
  <rect x="440" y="20" width="300" height="210" rx="10" fill="#e8f0fe" stroke="#2f6fde" stroke-width="1.5"/>
  <text x="460" y="48" font-size="15" font-weight="600" fill="#1a4fa8">iframe: public/photocraft/</text>
  <rect x="460" y="66" width="260" height="146" rx="8" fill="#fff" stroke="#2f6fde" stroke-opacity=".5"/>
  <text x="476" y="92" font-weight="600" fill="#222">PhotoCraft (Rust → WebAssembly)</text>
  <text x="476" y="122" fill="#333">embed.rs — мост</text>
  <text x="476" y="150" fill="#333">слои, маски, фильтры, PSD</text>
  <text x="476" y="178" fill="#333">рендер: WebGPU / WebGL2</text>
  <text x="476" y="200" fill="#777" font-size="12">index.html · .js · _bg.wasm</text>
</svg>
