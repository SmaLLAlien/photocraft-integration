# Пересборка PhotoCraft (Rust → WebAssembly) с мостом для встраивания.
# Результат — архив photocraft-embed-kit: сборка редактора + Angular-компонент + инструкция.
# На теге v* архив прикрепляется к GitHub Release.
name: editor

on:
  push:
    branches: [main]
    paths:
      - "photocraft/**"
      - ".github/workflows/editor.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "photocraft/**"
  workflow_dispatch:

permissions:
  contents: write   # для прикрепления архива к релизу

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: photocraft

      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin
          trunk --version

      - name: Build PhotoCraft web
        working-directory: photocraft/apps/photocraft-web
        run: trunk build --release

      - name: Assemble embed kit
        run: |
          mkdir -p kit/public kit/src/app/photocraft
          cp -r photocraft/dist/web kit/public/photocraft
          cp angular/src/app/photocraft/*.ts kit/src/app/photocraft/
          cp docs/INTEGRATION.md kit/
          (cd kit && zip -qr ../photocraft-embed-kit.zip .)
          ls -la kit/public/photocraft

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-embed-kit
          path: kit/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: photocraft-embed-kit.zip
